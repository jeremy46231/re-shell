[project]
name = "android-re"
version = "1.0.0"
requires-python = ">=3.13"
dependencies = [
    "frida",
    "hermes-dec>=0.1.0",
    "ipython",
    "pyaxmlparser",
    "yara-python",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
bypass-selection = true
