[project]
name = "re-env"
version = "1.0.0"
requires-python = ">=3.13"
dependencies = [
    # General
    "frida",
    "ipython",
    "yara-python",
    # Android
    "hermes-dec>=0.1.0",
    "pyaxmlparser",
    # Windows
    "capstone",
    "dnfile",
    "lief",
    "oletools",
    "pefile",
    "unicorn",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
bypass-selection = true
