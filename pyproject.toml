[project]
name = "re-env"
version = "1.0.0"
requires-python = ">=3.13"
dependencies = [
    # General
    "frida",
    "ipython",
    "pyghidra",
    "yara-python",
    # Android
    "hermes-dec>=0.1.0",
    "pyaxmlparser",
    # Windows
    "capstone",
    "dnfile",
    "lief",
    "oletools",
    "pefile",
    "unicorn",
    # Web
    "beautifulsoup4",
    "grpcio",
    "grpcio-tools",
    "haralyzer",
    "protobuf",
    "numpy>=2.5.1",
    "scipy>=1.18.0",
    "pillow>=12.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
bypass-selection = true
